# What:     Project metadata and pytest configuration (no packaging/build config).
# In:       Read by pytest at startup.
# Out:      Test discovery rules and import path.
# Fails if: pytest is run from outside the repo root, so `app` isn't importable.

[project]
name = "invoice-intelligence"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls the real Anthropic API (costs money); skipped unless RUN_LIVE_TESTS=1",
]
